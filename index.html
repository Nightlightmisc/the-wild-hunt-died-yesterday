<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food For Fabolous</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-wrapper">
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <a href="#" class="logo" id="logo-home">Food For Fabolous</a>
          <a href="#" class="logo2"> // Make your days better</a>
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
          <span class="burger-bar" id="bar-top"></span>
          <span class="burger-bar" id="bar-mid"></span>
          <span class="burger-bar" id="bar-bot"></span>
        </button>

        <ul class="nav-links" id="nav-links">
          <li class="nav-item"><a href="#" class="nav-link active-link">Home</a></li>
          <li class="nav-item"><a href="#" class="nav-link" id="about-link">About</a></li>
        </ul>
      </div>
    </nav>

    <div class="search-menu-bar">
      <form class="search-form" id="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="Find a recipe..."
          class="search-input"
        />

        <select id="category-select" class="category-select">
          <option value="">All Categories</option>
        </select>

        <button type="submit" class="search-button">
          Search
        </button>
      </form>
    </div>
  </div>

  <main class="recipe-content" id="recipe-content">
    <div id="status-msg" class="status-msg">Loading recipes...</div>
    <div id="recipes-grid" class="recipes-grid" style="display: none;"></div>
  </main>

  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="close-modal" id="close-modal" aria-label="Close recipe">×</button>
      <img id="modal-img" class="modal-img" src="" alt="" />
      <h2 id="modal-title"></h2>

      <div class="modal-details-badge">
        <span><strong>Cuisine:</strong> <span id="modal-cuisine"></span></span>
        <span><strong>Category:</strong> <span id="modal-category"></span></span>
        <span><strong>Calories:</strong> <span id="modal-calories"></span></span>
      </div>

      <div class="section-block">
        <h3>Ingredients</h3>
        <ul id="modal-ingredients"></ul>
      </div>

      <div class="section-block">
        <h3>Instructions</h3>
        <ol id="modal-instructions"></ol>
      </div>
    </div>
  </div>

  <div id="about-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="close-modal" id="close-about-modal">×</button>
      <h3>About</h3>
      <p style="color: #ccc; margin-top: 1rem;">This application brings magnificent culinary recipes straight to thy table using the DummyJSON archives!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
